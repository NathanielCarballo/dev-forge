<div class="dialog">
<mat-progress-bar mode="indeterminate" color="warn"></mat-progress-bar>
<h2 mat-dialog-title>Discard?</h2>
<mat-dialog-content class="mat-typography">
    <p>All content will be lost</p>
    <p>Are you sure you want to continue?</p>
</mat-dialog-content>
<mat-dialog-actions align="end" class="action-buttons">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button mat-raised-button [mat-dialog-close]="true" cdkFocusIntital (click)="navigateToHome()">Continue</button>
</mat-dialog-actions>
</div>
